  /api/v1/admin/events:
    get:
      description: Get a list of all events with pagination, search, and filtering
        (Admin only)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by event title or description
        in: query
        name: search
        type: string
      - description: Filter by location
        in: query
        name: location
        type: string
      - description: Filter by status (draft, pending, approved, held, rejected)
        in: query
        name: status
        type: string
      - description: Filter by organizer ID
        in: query
        name: organizer_id
        type: string
      - description: Filter by start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter by end date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Filter by minimum price
        in: query
        name: min_price
        type: number
      - description: Filter by maximum price
        in: query
        name: max_price
        type: number
      - default: '"-created_at"'
        description: Sort by field with optional '-' prefix for desc (e.g., '-created_at',
          'title', '-status')
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: Get all events (Admin)
      tags:
      - Admin
    post:
      consumes:
      - multipart/form-data
      description: Create a new event with the provided details (Admin only)
      parameters:
      - description: Event title
        in: formData
        name: title
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event banner image
        in: formData
        name: banner_image
        required: true
        type: file
      - description: Event categories (comma-separated like \
        in: formData
        name: category
        required: true
        type: string
      - description: Venue name
        in: formData
        name: venue_name
        required: true
        type: string
      - description: Event address
        in: formData
        name: address
        required: true
        type: string
      - description: Start date (RFC3339 format)
        in: formData
        name: start_date
        required: true
        type: string
      - description: End date (RFC3339 format)
        in: formData
        name: end_date
        required: true
        type: string
      - description: Timezone
        in: formData
        name: timezone
        type: string
      - description: Event capacity
        in: formData
        name: capacity
        required: true
        type: integer
      - description: Ticket price
        in: formData
        name: price
        required: true
        type: number
      - description: Commission rate for admin
        in: formData
        name: commission_rate
        type: number
      - description: Event tiers as JSON string array of {tier_template_id, price,
          quantity, gst, sales_start, sales_end, sort_order}
        in: formData
        name: tiers
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Event'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: Create a new event (Admin)
      tags:
      - Admin
