        name: twitter_url
        type: string
      - description: Instagram URL
        in: formData
        name: instagram_url
        type: string
      - description: LinkedIn URL
        in: formData
        name: linkedin_url
        type: string
      - description: YouTube URL
        in: formData
        name: youtube_url
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Company information updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.CompanyInfoResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
