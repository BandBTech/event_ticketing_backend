    post:
      consumes:
      - multipart/form-data
      description: Create a payment bill to track organizer payout for a single event.\n\nThe
        system automatically calculates the outstanding organizer earnings from completed
        transactions (minus any previously paid bills). The bill is created with default
        priority 'normal' and can be updated later for additional details.
      parameters:
      - description: UUID of the event
        example: fa50c770-6a8c-4f50-a9fc-84c9dce21fe9
        in: formData
        name: event_id
        required: true
        type: string
      - description: UUID of the organizer
        example: dcf2dda4-a490-4898-a402-d301567c2cf6
        in: formData
        name: organizer_id
        required: true
        type: string
      - description: 'Payment method: bank_transfer | check | cash | mobile_payment
          | other (optional)'
        in: formData
        name: payment_method
        type: string
      - description: Optional payment proof screenshot (jpg/png/pdf, max 10 MB)
        in: formData
        name: screenshot
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Bill created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.PaymentBillResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: Create payment bill
      tags:
      - Financial
  /api/v1/admin/payments/bills/{bill_id}:
    get:
      consumes:
      - application/json
      description: Get full details of a payment bill including organizer earnings
        breakdown,\ncurrent paid_amount, remaining_amount, and payment history.
      parameters:
      - description: UUID of the bill
        in: path
        name: bill_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bill detail with billed_amount, paid_amount, remaining_amount
            and status
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.PaymentBillResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: Get payment bill by ID
      tags:
      - Financial
    put:
      consumes:
      - application/json
      description: Record a (partial) payment or change the bill status.\n\nWhen **payment_amount**
        is provided the service increments **paid_amount** and decrements **remaining_amount**
        then sets status automatically:\n- remaining_amount == 0 → **paid**\n- remaining_amount
        > 0  → **partially_paid**\n\nOmit payment_amount for a status-only update
        (e.g. mark as cancelled or overdue).
      parameters:
      - description: UUID of the bill to update
        in: path
        name: bill_id
        required: true
        type: string
      - description: Update payload. status is required; payment_amount triggers partial/full
          payment logic.
        in: body
        name: bill
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePaymentBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated bill with current paid_amount and remaining_amount
