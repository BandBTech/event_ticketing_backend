name: Deploy to PROD of Timro Ticket

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to Production
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            APP_DIR="/var/www/api.timroticket.com"
            REPO="git@github.com:BandBTech/event_ticketing_backend.git"
            BRANCH="production"
            GIT_KEY="~/.ssh/id_ed25519_timroticketprod"

            echo "======================================"
            echo "Starting Production Deployment"
            echo "======================================"

            # Install Docker Compose v2 if not present
            if ! docker compose version 2>/dev/null | grep -q "v2"; then
              echo "Installing Docker Compose v2..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            echo "Docker Compose: $(docker compose version)"

            # Install/upgrade buildx plugin to 0.17.0+
            BUILDX_VERSION=$(docker buildx version 2>/dev/null | grep -oP 'v\K[0-9]+\.[0-9]+' | head -1)
            REQUIRED="0.17"
            if [ -z "$BUILDX_VERSION" ] || [ "$(echo -e "$BUILDX_VERSION\n$REQUIRED" | sort -V | head -1)" != "$REQUIRED" ]; then
              echo "Installing latest Docker buildx..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/buildx/releases/latest/download/buildx-latest.linux-amd64 \
                -o /usr/local/lib/docker/cli-plugins/docker-buildx
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
            fi
            echo "Docker Buildx: $(docker buildx version)"

            # Fresh clone if missing
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found. Cloning..."
              rm -rf "$APP_DIR"
              GIT_SSH_COMMAND="ssh -i $GIT_KEY -o StrictHostKeyChecking=no" \
              git clone -b "$BRANCH" "$REPO" "$APP_DIR"
            else
              echo "Repository exists. Checking..."
              cd "$APP_DIR"
              if ! git rev-parse HEAD >/dev/null 2>&1; then
                echo "Corrupted repository detected. Re-cloning..."
                cd /var/www
                rm -rf "$APP_DIR"
                GIT_SSH_COMMAND="ssh -i $GIT_KEY -o StrictHostKeyChecking=no" \
                git clone -b "$BRANCH" "$REPO" "$APP_DIR"
              else
                echo "Updating source code..."
                GIT_SSH_COMMAND="ssh -i $GIT_KEY -o StrictHostKeyChecking=no" \
                git fetch origin
                git checkout "$BRANCH"
                git reset --hard "origin/$BRANCH"
                git clean -fd
              fi
            fi

            echo "======================================"
            echo "Building Containers"
            echo "======================================"
            cd "$APP_DIR"
            docker compose down || true
            DOCKER_BUILDKIT=1 docker compose up -d --build --remove-orphans

            echo "======================================"
            echo "Deployment Completed Successfully"
            echo "======================================"
          EOF
