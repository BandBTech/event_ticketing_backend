name: Deploy to PROD of Timro Ticket

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Clone repository to PROD or Pull changes if already cloned
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            if [ ! -d "/var/www/api.timroticket.com/.git" ]; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_timroticketprod" git clone -b production git@github.com:BandBTech/event_ticketing_backend.git /var/www/api.timroticket.com
            else
              cd /var/www/api.timroticket.com
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_timroticketprod" git reset --hard 
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_timroticketprod" git pull --rebase origin production
            fi
          EOF

      - name: Build and Deploy App on PROD
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/api.timroticket.com
            echo "🧹 Cleaning up old containers"
            docker compose -f docker-compose.yml down
            echo "📦 Rebuilding Docker image"
            docker compose -f docker-compose.yml up -d --build
            echo "✅ Deployment complete"
          EOF
