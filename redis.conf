# Redis Configuration for Event Ticketing Backend
# Optimized for both development and production environments

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence - RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Persistence - AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 100mb
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
# Disable memory overcommit warnings
# (Set vm.overcommit_memory=1 on host system)
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# Logging
loglevel notice

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Replication settings (ensure master mode)
replica-read-only no

# Security
# requirepass your_redis_password_here

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511
daemonize no

# Background operations
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# AOF Corruption Recovery
# If AOF is corrupted, Redis will not load on startup
# Set to 'no' to allow loading with corrupted AOF (dangerous, data loss possible)
aof-load-truncated yes

# Asynq compatibility
# Ensure we're not in readonly mode
replica-read-only no
replica-serve-stale-data yes
replica-priority 100

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Advanced settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
hz 10